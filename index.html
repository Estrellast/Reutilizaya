<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ReutilizaYa - Ciudad</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #e6f2e6;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2e7d32;
    }
    .mensaje {
      background: #d4f6ec;
      border: 1px solid #a1e6d4;
      color: #0b665b;
      padding: 10px;
      border-radius: 5px;
      max-width: 500px;
      margin: 10px auto 20px;
      text-align: center;
      font-weight: bold;
    }
    form {
      background: white;
      padding: 15px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #4caf50;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
    }
    .item {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }
    .item img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .map {
      height: 200px;
      margin-top: 10px;
      border-radius: 8px;
    }
    #selectMap {
      height: 200px;
      border: 2px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      color: #666;
    }
    footer span {
      color: #2e7d32;
      font-weight: bold;
    }
    .firma {
      margin-top: 40px;
      text-align: center;
      font-size: 0.8em;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>ReutilizaYa - Ciudad</h1>

  <div class="mensaje" id="mensajePrincipal">
    Fotografía y comparte los objetos útiles que encuentres en tu ciudad.
  </div>

  <form id="itemForm">
    <input type="text" id="title" placeholder="Título del objeto" required />
    <textarea id="description" placeholder="Descripción" required></textarea>
    <input type="tel" id="whatsapp" placeholder="Tu número de WhatsApp (opcional)" />
    <input type="file" id="image" accept="image/*" required />
    <div id="selectMap"></div>
    <button type="submit">Compartir objeto</button>
  </form>

  <div id="itemsList"></div>

  <footer>
    Creado por <span>Francisco Manuel Cabello</span> · Córdoba, España
    <div class="firma">siguetuestrella.com</div>
  </footer>

  <script>
    const AIRTABLE_TOKEN = "patC6wUkZkVJY77Xx";
    const AIRTABLE_BASE = "appCuUZh491Zyyfml";
    const AIRTABLE_TABLE = "ReutilizaYa";

    const urlParams = new URLSearchParams(window.location.search);
    const ciudadSeleccionada = urlParams.get("ciudad") || "";
    const startLat = parseFloat(urlParams.get("lat")) || 37.8882;
    const startLng = parseFloat(urlParams.get("lng")) || -4.7794;

    const form = document.getElementById('itemForm');
    const list = document.getElementById('itemsList');

    const map = L.map('selectMap').setView([startLat, startLng], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let selectedLatLng = null;

    map.on('click', function (e) {
      selectedLatLng = e.latlng;
      if (marker) {
        marker.setLatLng(e.latlng);
      } else {
        marker = L.marker(e.latlng).addTo(map);
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const desc = document.getElementById('description').value;
      const number = document.getElementById('whatsapp').value.trim();
      const file = document.getElementById('image').files[0];

      if (!selectedLatLng) {
        alert('Haz clic en el mapa para indicar la ubicación del objeto.');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function () {
        const imageBase64 = reader.result;
        const imgurLink = await subirAImgur(imageBase64);

        const item = {
          title,
          description: desc,
          image: imgurLink,
          lat: selectedLatLng.lat,
          lng: selectedLatLng.lng,
          whatsapp: number,
          ciudad: ciudadSeleccionada
        };

        mostrarObjeto(item);
        await enviarAAirtable(item);
        form.reset();
        if (marker) map.removeLayer(marker);
        marker = null;
        selectedLatLng = null;
      };
      reader.readAsDataURL(file);
    });

    async function subirAImgur(imagenBase64) {
      const clientId = "5464d592f83979e"; // pública
      const response = await fetch("https://api.imgur.com/3/image", {
        method: "POST",
        headers: {
          Authorization: "Client-ID " + clientId,
          Accept: "application/json"
        },
        body: new URLSearchParams({
          image: imagenBase64.split(",")[1],
          type: "base64"
        })
      });
      const data = await response.json();
      return data.data.link;
    }

    async function enviarAAirtable(obj) {
      const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(AIRTABLE_TABLE)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${AIRTABLE_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fields: {
            Título: obj.title,
            Descripción: obj.description,
            Imagen: obj.image,
            Latitud: obj.lat,
            Longitud: obj.lng,
            WhatsApp: obj.whatsapp,
            Ciudad: obj.ciudad
          }
        })
      });
      const data = await res.json();
      console.log("Guardado en Airtable:", data);
    }

    function mostrarObjeto(obj) {
      const div = document.createElement('div');
      div.className = 'item';

      let whatsappLink = '';
      let compartirLink = '';
      if (obj.whatsapp) {
        const cleanNumber = obj.whatsapp.replace(/\D/g, '');
        whatsappLink = `<a class="whatsapp-btn" target="_blank" href="https://wa.me/${cleanNumber}">Contactar por WhatsApp</a>`;
        const texto = encodeURIComponent(`¡He encontrado esto en ReutilizaYa!\n${obj.title}\n${obj.description}`);
        compartirLink = `<a class="whatsapp-btn" style="background-color:#388e3c;" target="_blank" href="https://wa.me/?text=${texto}">Compartir por WhatsApp</a>`;
      }

      div.innerHTML = `
        <h3>${obj.title}</h3>
        <img src="${obj.image}" alt="Objeto compartido" />
        <p>${obj.description}</p>
        ${whatsappLink}<br>${compartirLink}
        <div class="map" id="map-${obj.lat}-${obj.lng}"></div>
      `;
      list.prepend(div);

      const objMap = L.map(`map-${obj.lat}-${obj.lng}`, {
        attributionControl: false,
        zoomControl: false,
        dragging: false,
        scrollWheelZoom: false
      }).setView([obj.lat, obj.lng], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(objMap);
      L.marker([obj.lat, obj.lng]).addTo(objMap);
    }
  </script>
</body>
</html>
