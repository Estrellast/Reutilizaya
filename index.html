!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ReutilizaYa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f5f0;
      color: #333;
      text-align: center;
    }
    .entrada {
      padding: 15px;
    }
    .entrada img {
      width: auto;
      height: 350px;
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
    #selectorCiudad {
      margin-top: 20px;
    }
    select {
      width: 90%;
      max-width: 300px;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
      border-radius: 6px;
      background-color: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
      border: 1px solid #a5d6a7;
    }
    .btn-verde {
      width: 90%;
      max-width: 300px;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
      border-radius: 6px;
      background-color: #4CAF50;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="entrada">
    <img src="entrada.png" alt="Bienvenida ReutilizaYa" />
    <div id="selectorCiudad">
      <h2>Selecciona tu ciudad</h2>
      <select id="ciudad">
        <option value="">-- Elegir ciudad --</option>
        <option value="Madrid" data-lat="40.4168" data-lng="-3.7038">Madrid</option>
        <option value="Barcelona" data-lat="41.3874" data-lng="2.1686">Barcelona</option>
        <option value="Sevilla" data-lat="37.3891" data-lng="-5.9845">Sevilla</option>
        <option value="Valencia" data-lat="39.4699" data-lng="-0.3763">Valencia</option>
        <option value="Córdoba" data-lat="37.8882" data-lng="-4.7794">Córdoba</option>
      </select>
      <br />
      <button class="btn-verde" onclick="confirmarCiudad()">Entrar</button>
    </div>
  </div>

  <script>
    function confirmarCiudad() {
      const select = document.getElementById("ciudad");
      const ciudad = select.value;
      const lat = select.options[select.selectedIndex].getAttribute("data-lat");
      const lng = select.options[select.selectedIndex].getAttribute("data-lng");

      if (!ciudad || !lat || !lng) {
        alert("Por favor, selecciona una ciudad.");
        return;
      }

      window.location.href = `app.html?ciudad=${encodeURIComponent(ciudad)}&lat=${lat}&lng=${lng}`;
    }
  </script>
</body>
</html>
